name: Materialize V2.5 Demo Sources

on:
  push:
    paths:
      - '.github/workflows/materialize-v25-demo.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode demo payloads
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          js=''.join(Path(f'.demo-build/js{i}.txt').read_text().strip() for i in range(1,5))
          css=''.join(Path(f'.demo-build/css{i}.txt').read_text().strip() for i in range(1,3))
          Path('decision-demo.js').write_bytes(gzip.decompress(base64.b64decode(js)))
          Path('decision-demo.css').write_bytes(gzip.decompress(base64.b64decode(css)))
          PY
          node --check decision-demo.js
      - name: Commit readable demo sources
        shell: bash
        run: |
          rm -f .github/workflows/materialize-v25-demo.yml
          git config user.name 'Vacation Planner Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add decision-demo.js decision-demo.css .github/workflows/materialize-v25-demo.yml
          git commit -m 'Materialize V2.5 demo sources'
          git push
