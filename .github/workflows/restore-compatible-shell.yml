name: Restore Compatible Shell

on:
  push:
    paths:
      - '.github/workflows/restore-compatible-shell.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good V2.4 app shell
        shell: bash
        run: |
          git show 3c8fc409:index.html > index.html
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('DECISION BETA · V2.4','DECISION DEMO · V2.5')
          tag='<script src="decision-demo-loader.js?v=2.5.4" defer></script>'
          if 'decision-demo-loader.js' not in s:
              s=s.replace('</body>',f'  {tag}\n</body>')
          else:
              s=re.sub(r'<script src="/?decision-demo-loader\.js[^\"]*"[^>]*></script>',tag,s)
          p.write_text(s)

          p=Path('sw.js')
          sw=p.read_text()
          sw=re.sub(r"const CACHE='[^']+';","const CACHE='ffvp-v2-5-4';",sw,count=1)
          p.write_text(sw)
          PY
      - name: Sanity-check shell contract
        shell: bash
        run: |
          grep -q 'data-target="today"' index.html
          grep -q 'id="familyMembers"' index.html
          grep -q 'id="addMember"' index.html
          grep -q 'decision-demo-loader.js?v=2.5.4' index.html
          node --check app.js
          node --check decision-demo-loader.js
      - name: Commit restored shell
        shell: bash
        run: |
          rm -f .github/workflows/restore-compatible-shell.yml
          git config user.name 'Vacation Planner Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js .github/workflows/restore-compatible-shell.yml
          git commit -m 'Restore V2.5 demo on compatible app shell'
          git push
